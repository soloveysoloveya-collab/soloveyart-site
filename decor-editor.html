<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Расстановка PNG — Соловей</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:#21191b;color:#fff7ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
    .bar{height:72px;padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid rgba(255,225,198,.22);background:#351f20;position:relative;z-index:2}
    button{min-height:42px;padding:8px 14px;border:1px solid rgba(255,225,198,.28);border-radius:999px;background:rgba(255,255,255,.06);color:#ffe4cb;font-weight:650;cursor:pointer}button[aria-pressed="true"]{background:#f2aa6c;color:#351b18;border-color:#ffd5ad}.hint{position:absolute;right:14px;max-width:250px;color:rgba(255,247,239,.68);font-size:12px;line-height:1.3;text-align:right}
    .stage{height:calc(100% - 72px);display:flex;justify-content:center;align-items:flex-start;overflow:hidden;padding:8px;background:#27222b}.holder{position:relative;flex:none}.holder iframe{position:absolute;left:0;top:0;border:0;background:#27222b;transform-origin:top left}
    @media(max-width:900px){.bar{justify-content:flex-start;overflow-x:auto;padding-right:12px}.hint{display:none}button{white-space:nowrap}}
  </style>
</head>
<body>
  <header class="bar">
    <button type="button" data-profile="desktop-wide" data-width="1440">Широкий десктоп</button>
    <button type="button" data-profile="desktop-narrow" data-width="1024">Ноутбук</button>
    <button type="button" data-profile="mobile" data-width="390">Мобильная</button>
    <span class="hint">Выбери размер, затем двигай PNG внутри сайта. Каждый режим сохраняется отдельно.</span>
  </header>
  <main class="stage"><div class="holder"><iframe title="Редактор расположения PNG"></iframe></div></main>
  <script>
    (()=>{
      const stage=document.querySelector('.stage');
      const holder=document.querySelector('.holder');
      const frame=document.querySelector('iframe');
      const buttons=[...document.querySelectorAll('button[data-profile]')];
      let current={profile:'mobile',width:390};
      const layout=()=>{
        const scale=Math.min(1,(stage.clientWidth-16)/current.width);
        const visibleHeight=stage.clientHeight-16;
        holder.style.width=(current.width*scale)+'px';
        holder.style.height=visibleHeight+'px';
        frame.style.width=current.width+'px';
        frame.style.height=(visibleHeight/scale)+'px';
        frame.style.transform='scale('+scale+')';
      };
      const select=(profile,width)=>{
        current={profile,width};
        buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.profile===profile)));
        frame.src='index.html?edit=decor&profile='+encodeURIComponent(profile)+'&v=editor-save-3';
        layout();
      };
      buttons.forEach(button=>button.addEventListener('click',()=>select(button.dataset.profile,Number(button.dataset.width))));
      addEventListener('resize',layout);
      select(current.profile,current.width);
    })();
  </script>
</body>
</html>
